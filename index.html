<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGMA - Login</title>
    <link rel="stylesheet" href="frontend/assets/css/style.css">
</head>
<body class="login-page">
    <div class="login-box">
        <div class="brand">
            <img src="frontend/assets/images/icons/logo_light.png" alt="SIGMA">
            <div>
                <h2>SIGMA</h2>
                <p>Sistema Integrado de Gestão de Ativos</p>
            </div>
        </div>
        <h2>Entrar no sistema</h2>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Email">
        </div>
        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Senha">
        </div>
        <div class="button-row">
            <a href="frontend/pages/dashboard.html">Entrar</a>
        </div>
    </div>
    <script src="../sql_sigma/frontend/assets/js/modules/usuarios/formulario.js"></script>
</body>
</html>
