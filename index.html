<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../"></script>
    <link rel="stylesheet" href="../sql_sigma/frontend/assets/css/style.css">
    <link rel="icon" href="../frontend/assets/images/icons/logo_light.png" type="image/png">
    <title>SIGMA</title>
</head>
<body>
    <!-- background -->
    <img src="../sql_sigma/frontend/assets/images/backgrounds/background_light.png" alt="" class="fundo">
    <div class="blur-fundo"></div>

    <!-- navbar -->
    <header>
        <!-- logo -->
        <div class="logo">
            <a href=".../index.html">
                <img src="../sql_sigma/frontend/assets/images/icons/logo_light.png" alt="">
            </a>
        </div>
        <h1>SIGMA</h1>
        <h1>Sistema Integrado de Gestão de Maquinas e Ativos</h1>
    </header>

    <!-- body/box_login -->
    <section>
        <div class="login">
            <div class="login_box">
                <!-- inputs login -->
                <h2>Login</h2>
                <form action="">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Email">
                    <label for="senha">Senha</label>
                    <input type="password" name="password" id="password" placeholder="Senha">                    
                </form>
            </div>
        </div>
    </section>

</body>
</html>
